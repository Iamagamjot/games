<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess the Number</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game">
    <section class="card">
      <p class="eyebrow">Logic game</p>
      <h1>Guess the Number</h1>
      <p class="intro">The secret number is between 1 and 50. See how quickly you can find it.</p>

      <div class="status">
        <p id="hint">Make your first guess.</p>
        <p id="attempts">Attempts: 0</p>
      </div>

      <form id="guessForm" class="form">
        <input id="guessInput" type="number" min="1" max="50" placeholder="Enter a guess" required />
        <button type="submit" class="primary">Guess</button>
      </form>

      <div class="controls">
        <button id="newGameBtn" type="button" class="ghost">New game</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
