<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reaction Rush</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game">
    <section class="card">
      <p class="eyebrow">Speed game</p>
      <h1>Reaction Rush</h1>
      <p class="intro">Wait for the signal, then click as fast as you can.</p>

      <div class="stats">
        <div><span>Best</span><strong id="bestTime">--</strong></div>
        <div><span>Last</span><strong id="lastTime">--</strong></div>
      </div>

      <div id="arena" class="arena waiting" role="button" tabindex="0" aria-label="Reaction game area">
        <span id="message">Press Start to begin</span>
      </div>

      <div class="controls">
        <button id="startBtn" class="primary">Start</button>
        <button id="resetBtn" class="ghost">Reset</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
